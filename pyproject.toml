[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "auralith"
version = "0.1.0"
description = "Local reference-based audio mastering platform."
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "Auralith contributors" }]
dependencies = [
	"agnara==1.0.3",
	"librosa==1.0.0",
	"matchering==2.0.6",
	"numpy==2.5.4",
	"pyloudnorm==0.2.0",
	"scipy==1.18.1",
	"soundfile==0.14.0",
	"streamlit==1.66.1",
]

[project.optional-dependencies]
dev = [
	"mypy==1.18.2",
	"pytest==9.1.1",
	"ruff==0.17.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py314"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
mypy_path = "src"
packages = ["auralith"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
